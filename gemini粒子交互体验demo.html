html_content = """<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千里江山与绚烂土星 - 极致全屏纯黑动效粒子交互系统</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000; /* 极致全黑背景 */
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* 悬浮现代玻璃质感控制面板 */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(230, 194, 128, 0.25);
            border-radius: 14px;
            padding: 20px;
            color: #f2ede4;
            width: 280px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        #ui-panel h2 {
            margin: 0 0 12px 0;
            font-size: 17px;
            font-weight: 500;
            color: #e6c280;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(230, 194, 128, 0.2);
            padding-bottom: 10px;
            text-align: center;
        }
        .control-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: #bcaba0;
        }
        select, input[type="color"], button {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(230, 194, 128, 0.25);
            color: #f2ede4;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 13px;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        select:hover, button:hover {
            background: rgba(230, 194, 128, 0.15);
            border-color: #e6c280;
        }
        select option {
            background: #141414;
            color: #f2ede4;
        }
        #status {
            margin-top: 12px;
            font-size: 12px;
            color: #e6c280;
            text-align: center;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 6px;
            line-height: 1.5;
        }
        .cam-preview {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            border-radius: 8px;
            border: 1px solid rgba(230, 194, 128, 0.2);
            transform: scaleX(-1); 
            opacity: 0.35;
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="input_video" class="cam-preview" autoplay playsinline></video>

    <div id="ui-panel">
        <h2>意境粒子·高级控制台</h2>
        
        <div class="control-group">
            <label for="shape-select">切换视觉场景</label>
            <select id="shape-select">
                <option value="landscape">千里江山图 (Landscape)</option>
                <option value="saturn">绚烂土星 (Saturn)</option>
                <option value="heart">唯美爱心 (Heart)</option>
                <option value="flower">盛放花朵 (Flower)</option>
                <option value="fireworks">幻彩烟花 (Fireworks)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="color-picker">基础色彩选择 (自适应常规场景)</label>
            <input type="color" id="color-picker" value="#ff6600">
        </div>

        <button id="fs-btn" style="margin-top: 5px;">全屏沉浸观赏</button>
        <div id="status">系统准备中，加载地理场拓扑...</div>
    </div>

    <script>
        // =========================================================================
        // 1. 全局渲染上下文初始化
        // =========================================================================
        const PARTICLE_COUNT = 100000; // 维持十万级超细腻微粒场
        let scene, camera, renderer, particles, geometry, material;
        
        // 核心动态缓冲区
        let basePositions = new Float32Array(PARTICLE_COUNT * 3);  // 拓扑基准坐标
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3); // 运行时目标坐标
        let targetColors = new Float32Array(PARTICLE_COUNT * 3);    // 运行时矿物色彩通道
        let particleSubtypes = new Uint8Array(PARTICLE_COUNT);      // 子结构物理类别标签
        let particleSizes = new Float32Array(PARTICLE_COUNT);       // 独立微粒径比率
        
        // 周期行为动力学数据结构
        let saturnAngles = new Float32Array(PARTICLE_COUNT);
        let saturnRadius = new Float32Array(PARTICLE_COUNT);
        let bridgeShedTimers = new Float32Array(PARTICLE_COUNT); // 桥沿落粒计时器
        let forestPColorTimers = new Float32Array(PARTICLE_COUNT); // 林木变色因子

        let currentShape = 'landscape';
        let globalTime = 0;
        let isHandActive = false;
        
        // 双轴手势控制器映射增益
        let globalSizeScale = 1.0;
        let targetSizeScale = 1.0;
        let defaultTiltX = 0.45;
        let targetRotX = 0.45, targetRotY = 0;

        // 东方经典矿物设色面板
        const cSilk = new THREE.Color('#8c7a51');   // 暖金古绢
        const cBlue = new THREE.Color('#1c3c73');   // 顶部石蓝
        const cGreen = new THREE.Color('#2d8553');  // 山腰翠绿
        const cBrown = new THREE.Color('#7a502c');  // 山脚土棕
        const cRiver = new THREE.Color('#4d736b');  // 浅青江水
        const cBridge = new THREE.Color('#ff5500'); // 璀璨飞桥橙

        initThreeJS();
        buildSceneTopology(currentShape);
        setupBackupControls();
        animate();

        setTimeout(connectVisionAI, 300);

        function initThreeJS() {
            scene = new THREE.Scene();
            // 雾化完全切入纯黑，使其自然消融于黑暗深空
            scene.fog = new THREE.FogExp2('#000000', 0.0035);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 88);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 1); // 强制渲染器背景纯黑
            document.body.appendChild(renderer.domElement);

            // 绘制细腻圆形光斑贴图
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(0.4, 'rgba(255,255,255,0.75)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 16, 16);

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PARTICLE_COUNT * 3), 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(PARTICLE_COUNT * 3), 3));
            
            // 引入专有自定义属性，用于着色器/渲染微分调节粒径大小
            geometry.setAttribute('sizeRatio', new THREE.BufferAttribute(new Float32Array(PARTICLE_COUNT), 1));

            material = new THREE.PointsMaterial({
                size: 0.38,
                map: new THREE.CanvasTexture(canvas),
                transparent: true,
                opacity: 0.88,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                vertexColors: true
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize);
        }

        // =========================================================================
        // 2. 数值多级拓扑演变场 (融合古画多维联动与科幻宏大构图)
        // =========================================================================
        function buildSceneTopology(shape) {
            const colorsAttr = geometry.attributes.color;
            const sizeRatioAttr = geometry.attributes.sizeRatio;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                let x = 0, y = 0, z = 0;
                let r = 1, g = 1, b = 1;
                let sz = 1.0;
                let subtype = 0; 
                // 廊桥细分子结构: 11:亭阁主体, 12:檐角外飘, 13:檐口环旋, 14:廊道桥面, 15:桥桩, 16:桥洞内壁淡青

                if (shape === 'landscape') {
                    // --- 核心场景：千里江山图 ---
                    if (i < 12000) { 
                        // [1] 古绢底色打底
                        x = (Math.random() - 0.5) * 240;
                        z = (Math.random() - 0.5) * 180;
                        y = (Math.random() - 0.5) * 90;
                        r = cSilk.r; g = cSilk.g; b = cSilk.b;
                        sz = 0.5; // 0.2px 级别极细粒子
                        subtype = 4; // 古绢底
                    } 
                    else if (i < 32000) { 
                        // [2] 江河水面
                        x = (Math.random() - 0.5) * 220;
                        z = (Math.random() - 0.5) * 160;
                        y = -18;
                        r = cRiver.r + (Math.random()-0.5)*0.03;
                        g = cRiver.g + (Math.random()-0.5)*0.03;
                        b = cRiver.b + (Math.random()-0.5)*0.03;
                        sz = THREE.MathUtils.randFloat(0.8, 1.2); // 0.3~0.5px
                        subtype = 3; // 水面江河
                    } 
                    else if (i < 38000) { 
                        // [3] 全景古廊桥架构 (高度精细参数复合)
                        const localI = i - 32000;
                        if (localI < 1500) { 
                            // 桥头亭阁主体 (95% 颤震 / 5% 外飘 / 10% 弧线盘旋)
                            const randVal = Math.random();
                            x = -40 + (localI % 15) * 0.5;
                            z = 10 + Math.floor(localI / 15 % 15) * 0.5;
                            y = -10 + Math.floor(localI / 225) * 0.6;
                            r = 0.15; g = 0.12; b = 0.1; // 暗褐墨黑
                            sz = THREE.MathUtils.randFloat(2.0, 3.0); // 0.8~1.2px
                            
                            if (randVal < 0.05) subtype = 12;      // 5% 檐角外飘
                            else if (randVal < 0.15) subtype = 13; // 10% 檐口盘旋
                            else subtype = 11;                     // 主体
                        } 
                        else if (localI < 4000) { 
                            // 桥面廊道与廊壁
                            const progress = (localI - 1500) / 2500;
                            x = -32.5 + progress * 65; 
                            z = 13.5 + Math.sin(progress * Math.PI) * 1.5;
                            y = -10 + Math.sin((x + 32.5) * 0.08) * 2.0;
                            r = 0.18; g = 0.14; b = 0.11;
                            sz = THREE.MathUtils.randFloat(1.3, 1.8); // 0.5~0.7px
                            subtype = 14; // 廊道桥面
                        } 
                        else if (localI < 5000) { 
                            // 水下桥桩与内壁淡青微光 (宝带特写)
                            const pIdx = localI - 4000;
                            const bridgeX = -30 + Math.floor(pIdx / 100) * 7;
                            x = bridgeX + (pIdx % 10) * 0.2;
                            z = 13.5 + (Math.random() - 0.5) * 1.0;
                            y = -10 - (Math.floor(pIdx / 10) % 10) * 0.8;
                            
                            if (Math.random() > 0.4) {
                                r = 0.1; g = 0.08; b = 0.06; // 桥桩暗色
                                sz = 1.0; // 0.4px
                                subtype = 15; // 桥桩
                            } else {
                                r = 0.3; g = 0.7; b = 0.65; // 洞壁淡青微光微粒
                                sz = 0.8;
                                subtype = 16; 
                            }
                        } 
                        else { 
                            // 桥头桥尾山林互通系统
                            x = (localI % 2 === 0) ? (-45 + Math.random() * 8) : (33 + Math.random() * 8);
                            z = 5 + Math.random() * 15;
                            y = -9 + Math.random() * 6;
                            r = cGreen.r * 0.8; g = cGreen.g * 1.2; b = cGreen.b * 0.8; // 浅绿山林微粒
                            sz = 1.2;
                            subtype = 17; // 山林往返粒子
                        }
                    } 
                    else if (i < 45000) {
                        // [4] 山峰交汇间的璀璨橙色霓虹飞桥
                        const progress = (i - 38000) / 7000;
                        x = -35 + progress * 70;
                        z = -5 + (Math.random() - 0.5) * 2.0;
                        const archY = Math.cos(x * 0.045) * 7.5 + 2; 
                        y = archY + (Math.random() - 0.5) * 0.6;
                        if(Math.random() > 0.35) {
                            r = cBridge.r; g = cBridge.g; b = cBridge.b;
                        } else {
                            r = 1.0; g = 0.78; b = 0.15; // 绝赞橙金交织
                        }
                        sz = 1.5;
                        subtype = 5; // 飞桥
                    }
                    else { 
                        // [5] 重峦叠嶂山体拓扑 (近山、中景、远景精密分级)
                        const gridX = (i % 300) - 150;
                        const gridZ = Math.floor(i / 300 % 185) - 90;
                        x = gridX * 0.65;
                        z = gridZ * 0.7;

                        let waveH = Math.sin(x * 0.054) * 16.5 + Math.cos(z * 0.062) * 14.5 + Math.sin((x + z) * 0.032) * 8.5;
                        waveH += Math.sin(x * 0.19) * 3.2 * Math.cos(z * 0.14); // 皴法棱角细节
                        
                        const edgeShield = THREE.MathUtils.mapLinear(Math.min(Math.abs(x), 95), 0, 95, 1, 1.45);
                        y = waveH * edgeShield - 9;

                        if (z < -30) { 
                            // 远景群山 (浅青+土黄, 0.3~0.5px, 云雾虚化)
                            if (Math.random() > 0.5) { r = 0.35; g = 0.52; b = 0.5; } 
                            else { r = 0.65; g = 0.55; b = 0.35; }
                            sz = THREE.MathUtils.randFloat(0.8, 1.3);
                            subtype = 23; // 远山
                        } else if (z < 15) { 
                            // 中景丘陵 (微动呼吸)
                            r = cGreen.r * 0.85; g = cGreen.g * 0.95; b = cGreen.b * 0.85;
                            sz = THREE.MathUtils.randFloat(1.3, 1.8); // 0.5~0.7px
                            subtype = 22; // 中景
                        } else { 
                            // 近山主峰 (硬朗分层: 顶石蓝、腰翠绿、脚土棕)
                            if (y > 6.5) {
                                r = cBlue.r; g = cBlue.g; b = cBlue.b; sz = THREE.MathUtils.randFloat(2.6, 3.4); // 1.0~1.3px
                            } else if (y > -5.0) {
                                r = cGreen.r; g = cGreen.g; b = cGreen.b; sz = THREE.MathUtils.randFloat(1.8, 2.4); // 0.7~0.9px
                            } else {
                                r = cBrown.r; g = cBrown.g; b = cBrown.b; sz = 1.5; // 0.6px
                            }
                            subtype = 21; // 近山
                        }
                    }
                } 
                else if (shape === 'saturn') {
                    // --- 绚烂橙色土星与白色双星环 ---
                    if (i < 55000) { 
                        // 土星实体球壳
                        const phi = Math.acos(2 * Math.random() - 1);
                        const theta = 2 * Math.PI * Math.random();
                        const isSurface = Math.random() > 0.25;
                        const rad = isSurface ? (18.5 + (Math.random() - 0.5) * 0.5) : (Math.random() * 18.5);
                        x = rad * Math.sin(phi) * Math.cos(theta);
                        y = rad * Math.sin(phi) * Math.sin(theta);
                        z = rad * Math.cos(phi);

                        const cChoice = Math.random();
                        if(cChoice > 0.55) { r = 1.0; g = 0.38; b = 0.02; } 
                        else if(cChoice > 0.15) { r = 0.92; g = 0.55; b = 0.08; } 
                        else { r = 0.75; g = 0.22; b = 0.04; }
                        sz = 1.2;
                        subtype = 40; // 土星体
                    } else { 
                        // 双层极扁平开普勒星环
                        const isOuter = i > 76000;
                        const rMin = isOuter ? 32.5 : 22.0;
                        const rMax = isOuter ? 45.0 : 29.5;
                        const angle = Math.random() * Math.PI * 2;
                        const rad = rMin + Math.random() * (rMax - rMin);
                        
                        saturnAngles[i] = angle;
                        saturnRadius[i] = rad;
                        x = rad * Math.cos(angle);
                        y = (Math.random() - 0.5) * 0.35;
                        z = rad * Math.sin(angle);

                        const bright = 0.78 + Math.random() * 0.22;
                        r = g = b = bright; // 细腻纯白微粒
                        sz = 0.9;
                        subtype = 41; // 星环
                    }
                } 
                else if (shape === 'heart') {
                    const t = Math.random() * Math.PI * 2;
                    const rv = Math.random();
                    const scaleFactor = 1.9 + rv * 0.3;
                    x = scaleFactor * 16 * Math.pow(Math.sin(t), 3);
                    y = scaleFactor * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) + 4;
                    z = (Math.random() - 0.5) * 11 * rv;
                    r = 0.98; g = 0.15; b = 0.4;
                    sz = 1.4;
                } 
                else if (shape === 'flower') {
                    const t = Math.random() * Math.PI * 2;
                    const rad = 26 * Math.random() * Math.cos(5 * t);
                    x = rad * Math.cos(t);
                    y = rad * Math.sin(t);
                    z = 4 * Math.sin(rad * 0.35) + (Math.random() - 0.5) * 2.5;
                    r = 0.9; g = 0.72; b = 0.12;
                    sz = 1.3;
                } 
                else if (shape === 'fireworks') {
                    const phi = Math.acos(2 * Math.random() - 1);
                    const theta = 2 * Math.PI * Math.random();
                    const rad = 36 * Math.pow(Math.random(), 0.35);
                    x = rad * Math.sin(phi) * Math.cos(theta);
                    y = rad * Math.sin(phi) * Math.sin(theta);
                    z = rad * Math.cos(phi);
                    r = Math.random(); g = Math.random(); b = Math.random();
                    sz = 1.6;
                }

                basePositions[i3] = x;
                basePositions[i3 + 1] = y;
                basePositions[i3 + 2] = z;
                
                // 初始化阶段强制赋予平流坐标
                targetPositions[i3] = x;
                targetPositions[i3 + 1] = y;
                targetPositions[i3 + 2] = z;

                targetColors[i3] = r;
                targetColors[i3 + 1] = g;
                targetColors[i3 + 2] = b;
                
                sizeRatioAttr.setX(i, sz);
                particleSubtypes[i] = subtype;
            }

            colorsAttr.copyArray(targetColors);
            colorsAttr.needsUpdate = true;
            sizeRatioAttr.needsUpdate = true;
            
            document.getElementById('status').innerText = "拓扑渲染场完成构建";
        }

        // =========================================================================
        // 3. 多线程周期驱动核与耦合联动流感系统
        // =========================================================================
        function animate() {
            requestAnimationFrame(animate);
            globalTime += 0.01;

            if (!geometry) return;

            const positions = geometry.attributes.position.array;
            const colors = geometry.attributes.color.array;

            // 平滑捏合阻尼缩放
            globalSizeScale += (targetSizeScale - globalSizeScale) * 0.12;
            material.size = 0.38 * globalSizeScale;

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const i3 = i * 3;
                const subtype = particleSubtypes[i];

                let tx = basePositions[i3];
                let ty = basePositions[i3 + 1];
                let tz = basePositions[i3 + 2];

                if (currentShape === 'landscape') {
                    // --- 全局联动物理场演算引擎 ---
                    if (subtype === 4) { 
                        // [1] 古绢底色: 小幅无规则布朗运动 (<=1px, 15s 周期)
                        const angle = i + globalTime * (Math.PI * 2 / 15);
                        tx += Math.sin(angle) * 0.5;
                        ty += Math.cos(angle * 1.2) * 0.5;
                    } 
                    else if (subtype === 3) { 
                        // [2] 水面主流流速: 0.25px/s 右上往左下 (负X, 负Z)
                        // 利用时间场进行偏移映射
                        let currentX = tx - globalTime * 2.5; 
                        let currentZ = tz - globalTime * 1.5;
                        
                        // 远景放缓至 0.15px/s
                        if (tz < -20) {
                            currentX = tx - globalTime * 1.5;
                            currentZ = tz - globalTime * 0.9;
                        }
                        
                        // 空间大边界循环缠绕包裹
                        tx = ((currentX + 110) % 220) - 110;
                        tz = ((currentZ + 80) % 160) - 80;
                        
                        // 零星光点随机上浮消散
                        if (i % 40 === 0) {
                            ty += (globalTime * 8 + i % 10) % 15;
                        }
                    } 
                    else if (subtype === 21) { 
                        // [3] 近山主峰: 协同呼吸起伏 +-2px / 7s 周期
                        const breathe = Math.sin(globalTime * (Math.PI * 2 / 7)) * 2.0;
                        ty += breathe;
                        // 边缘 6% 粒子外飘 8~12px, 3s 回弹
                        if (i % 16 === 0) {
                            const offsetFactor = Math.sin(globalTime * (Math.PI * 2 / 3));
                            tx += offsetFactor * 10;
                        }
                        // 山脚粒子向水面微幅蔓延溢出
                        if (basePositions[i3+1] < -10) {
                            tx += Math.sin(globalTime + i) * 1.5;
                        }
                    } 
                    else if (subtype === 22) { 
                        // [4] 中景丘陵: 微动 +-1px / 9s 周期
                        ty += Math.sin(globalTime * (Math.PI * 2 / 9)) * 1.0;
                        // 3% 沟壑粒子滚落山脚并入水岸
                        if (i % 33 === 0) {
                            ty -= (globalTime * 4) % 12;
                            tx += Math.cos(i) * 2;
                        }
                    } 
                    else if (subtype === 23) { 
                        // [5] 远景群山: 60%~90% 透明度循环闪烁 / 12s 周期
                        // 这里通过微调局部颜色灰度值来联动逼真模拟透明度脉动
                        const pulse = 0.75 + Math.sin(globalTime * (Math.PI * 2 / 12)) * 0.15;
                        colors[i3] = targetColors[i3] * pulse;
                        colors[i3+1] = targetColors[i3+1] * pulse;
                        colors[i3+2] = targetColors[i3+2] * pulse;
                    }
                    else if (subtype >= 11 && subtype <= 17) {
                        // [6] 古廊桥多级耦合动态场
                        if (subtype === 11) { // 亭阁主体原地震颤
                            tx += Math.sin(globalTime * 40 + i) * 0.03; // 振幅 ~3px 映射
                            ty += Math.cos(globalTime * 35 + i) * 0.03;
                        } 
                        else if (subtype === 12) { // 檐角 5% 粒子外飘回弹
                            const floatAmp = Math.sin(globalTime * (Math.PI * 2 / 1.8)) * 0.3;
                            tx += floatAmp * 6; ty += Math.abs(floatAmp) * 3;
                        } 
                        else if (subtype === 13) { // 10% 檐口粒子沿屋面弧线螺旋
                            const theta = globalTime * (Math.PI * 2 / 2.2) + i;
                            tx += Math.sin(theta) * 0.5;
                            tz += Math.cos(theta) * 0.5;
                        } 
                        else if (subtype === 14) { // 桥面廊道呼吸伸缩与横向慢游
                            ty += Math.sin(globalTime * (Math.PI * 2 / 5)) * 0.08; // 呼吸
                            tx += Math.sin(globalTime * (Math.PI * 2 / 6) + i) * 0.15; // 横向游走
                        } 
                        else if (subtype === 15) { // 50% 桥桩 4s 周期上下浮沉
                            if (i % 2 === 0) {
                                ty += Math.sin(globalTime * (Math.PI * 2 / 4)) * 0.15;
                            }
                        } 
                        else if (subtype === 16) { // 桥洞水粒子逆势沿壁向上爬升
                            let climb = (globalTime * 6 + (i % 10)) % 12;
                            ty += climb;
                            // 涡旋
                            const rotTheta = globalTime * (Math.PI * 2 * 0.18);
                            tx += Math.sin(rotTheta) * 0.3;
                        }
                        else if (subtype === 17) { // 山林粒子飘落桥面并发生质能色彩渐变转换
                            // 在Y轴向下坠落
                            let dropY = -(globalTime * 2.5 % 8);
                            ty += dropY;
                            if (dropY < -4.0) { // 色彩在空中渐变为深棕廊桥色
                                colors[i3] += (0.16 - colors[i3]) * 0.1;
                                colors[i3+1] += (0.13 - colors[i3+1]) * 0.1;
                                colors[i3+2] += (0.1 - colors[i3+2]) * 0.1;
                            }
                        }
                    }
                } 
                else if (currentShape === 'saturn') {
                    // --- 土星环旋转物理学 ---
                    if (subtype === 41) {
                        const speed = 0.015 * (28 / saturnRadius[i]); // 拟合离心轨道速度
                        saturnAngles[i] += speed;
                        tx = saturnRadius[i] * Math.cos(saturnAngles[i]);
                        tz = saturnRadius[i] * Math.sin(saturnAngles[i]);
                        basePositions[i3] = tx;
                        basePositions[i3 + 2] = tz;
                    }
                }

                // 终极缓动阻尼平滑插值，逼真响应形变与姿态
                positions[i3]     += (tx - positions[i3]) * 0.07;
                positions[i3 + 1] += (ty - positions[i3 + 1]) * 0.07;
                positions[i3 + 2] += (tz - positions[i3 + 2]) * 0.07;
            }

            geometry.attributes.position.needsUpdate = true;
            if (currentShape === 'landscape') geometry.attributes.color.needsUpdate = true;

            // 智能手势状态回归与循环旋转驱动
            if (!isHandActive) {
                targetSizeScale = 1.0; // 回弹经典粒径
                // 倾角与视线温和回归原始构图
                particles.rotation.x += (defaultTiltX - particles.rotation.x) * 0.04;
                particles.rotation.y += 0.0016; // 慢速自动循环旋转
            } else {
                // 手势接管时的插值追随
                particles.rotation.x += (targetRotX - particles.rotation.x) * 0.08;
                particles.rotation.y += (targetRotY - particles.rotation.y) * 0.08;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // =========================================================================
        // 4. 面板控件绑定
        // =========================================================================
        document.getElementById('shape-select').addEventListener('change', (e) => {
            currentShape = e.target.value;
            particles.rotation.set(0, 0, 0);
            buildSceneTopology(currentShape);
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
            const picked = new THREE.Color(e.target.value);
            if (currentShape !== 'landscape' && currentShape !== 'saturn') {
                const colorsAttr = geometry.attributes.color;
                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    colorsAttr.setXYZ(i, picked.r * (0.6 + Math.random()*0.4), picked.g * (0.6 + Math.random()*0.4), picked.b * (0.6 + Math.random()*0.4));
                }
                colorsAttr.needsUpdate = true;
            }
        });

        document.getElementById('fs-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.body.requestFullscreen();
            else document.exitFullscreen();
        });

        // =========================================================================
        // 5. Google MediaPipe 神经手势识别双轴交互解算器
        // =========================================================================
        function connectVisionAI() {
            const statusElement = document.getElementById('status');
            try {
                if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
                    throw new Error("外部AI图形库离线");
                }

                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.65,
                    minTrackingConfidence: 0.65
                });

                hands.onResults(onHandGestureAnalysis);

                const videoElement = document.getElementById('input_video');
                const cameraInst = new Camera(videoElement, {
                    onFrame: async () => { await hands.send({image: videoElement}); },
                    width: 640, height: 480
                });

                cameraInst.start()
                    .then(() => {
                        statusElement.innerText = "智能AI摄像头启动成功！\\n两指捏合控微粒粗细 | 挥手360°旋转";
                        statusElement.style.color = "#4CAF50";
                    })
                    .catch(() => {
                        statusElement.innerText = "未捕获摄像头，已默认无缝调启【全屏鼠标/触控替代驱动】。";
                        statusElement.style.color = "#FF9800";
                    });

            } catch (e) {
                statusElement.innerText = "已为您自动激活【全屏鼠标/触控替代交互驱动】。";
                statusElement.style.color = "#ffb74d";
            }
        }

        let lastGestureX = null, lastGestureY = null;

        function onHandGestureAnalysis(results) {
            const statusElement = document.getElementById('status');
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                isHandActive = true;
                const landmarks = results.multiHandLandmarks[0];

                // [高级交互一] 指尖两指捏合控制粒子几何大小
                const thumb = landmarks[4];
                const index = landmarks[8];
                const distance = Math.sqrt(Math.pow(thumb.x - index.x, 2) + Math.pow(thumb.y - index.y, 2));
                // 线性精密映射增益
                let mappedScale = THREE.MathUtils.mapLinear(distance, 0.02, 0.22, 0.15, 2.2);
                targetSizeScale = Math.max(0.1, Math.min(3.0, mappedScale));

                // [高级交互二] 手掌移动驱动全场景360度自由抓取矩阵翻转
                const currentX = landmarks[9].x;
                const currentY = landmarks[9].y;

                if (lastGestureX !== null && lastGestureY !== null) {
                    const dx = currentX - lastGestureX;
                    const dy = currentY - lastGestureY;
                    targetRotY -= dx * 4.0;
                    targetRotX -= dy * 4.0;
                }
                lastGestureX = currentX;
                lastGestureY = currentY;

                statusElement.innerText = `手势接管中 | 粒子缩放比: ${targetSizeScale.toFixed(2)}`;
                statusElement.style.color = "#00bcd4";
            } else {
                isHandActive = false;
                lastGestureX = null; lastGestureY = null;
                statusElement.innerText = "手掌未入镜 | 自动慢速自转巡航";
                statusElement.style.color = "#b5a499";
            }
        }

        // =========================================================================
        // 6. 防崩安全防护：全屏幕鼠标/触屏备用仿真控制器
        // =========================================================================
        function setupBackupControls() {
            let dragActive = false;
            let lastMouseX = 0, lastMouseY = 0;

            window.addEventListener('mousedown', (e) => {
                if(e.clientX < 310 && e.clientY < 310) return; // 避开操作面板
                dragActive = true;
                isHandActive = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (dragActive) {
                    const dx = e.clientX - lastMouseX;
                    const dy = e.clientY - lastMouseY;
                    targetRotY += dx * 0.008;
                    targetRotX += dy * 0.008;
                    lastMouseX = e.clientX;
                    lastMouseY = e.clientY;
                }
            });

            window.addEventListener('mouseup', () => {
                dragActive = false;
                isHandActive = false;
            });

            // 滚轮无缝充当捏合手势
            window.addEventListener('wheel', (e) => {
                isHandActive = true;
                if (e.deltaY > 0) {
                    targetSizeScale = Math.min(3.0, targetSizeScale + 0.06);
                } else {
                    targetSizeScale = Math.max(0.1, targetSizeScale - 0.06);
                }
                clearTimeout(window.wheelDamping);
                window.wheelDamping = setTimeout(() => { isHandActive = false; }, 1000);
            });
        }
    </script>
</body>
</html>
